[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cc-memory-index"
dynamic = ["version"]
description = "Generate Claude Code's auto-memory index (MEMORY.md) from each memory file's frontmatter, within the load limit, without losing hand-added lines."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = []
authors = [{ name = "oh-namgyu" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/oh-namgyu/cc-memory-index"

[project.scripts]
cc-memory-index = "cc_memory_index.cli:main"

[tool.setuptools]
packages = ["cc_memory_index"]

[tool.setuptools.dynamic]
version = { attr = "cc_memory_index.__version__" }
