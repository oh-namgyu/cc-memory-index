name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: py${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows matters: line endings, reparse points and the lack of dir_fd all
        # take different code paths there.
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.12"]

    steps:
      # Actions are pinned to full commit SHAs (tag in the comment).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest

      # Static checks once per OS. mypy 1.20.2 is the last release that accepts --python-version 3.9.
      - name: Install static checkers
        if: matrix.python-version == '3.12'
        run: python -m pip install --disable-pip-version-check pyflakes==4.0.3 mypy==1.20.2

      - name: Pyflakes
        if: matrix.python-version == '3.12'
        run: python -m pyflakes cc_memory_index hooks scripts tests

      - name: Type check
        if: matrix.python-version == '3.12'
        run: python -m mypy --strict --python-version 3.9 cc_memory_index

      - name: Forbidden-API gate
        run: python scripts/check_forbidden.py

      - name: Compile
        run: python -m compileall -q cc_memory_index

      - name: Test
        run: python -m pytest -q -rs -p no:cacheprovider tests/

      - name: Install and smoke the entry point
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check .
          cc-memory-index --version
          store="$(mktemp -d)"
          cc-memory-index --dir "$store" build
          cc-memory-index --dir "$store" check
