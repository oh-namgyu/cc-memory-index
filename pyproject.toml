[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cc-memory-index"
version = "0.1.0"
description = "Generate Claude Code's auto-memory index (MEMORY.md) from each memory file's frontmatter, within the load limit, without losing hand-added lines."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []
authors = [{ name = "oh-namgyu" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/oh-namgyu/cc-memory-index"

[project.scripts]
cc-memory-index = "cc_memory_index.cli:main"

[tool.setuptools]
packages = ["cc_memory_index"]
